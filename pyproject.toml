[project]
name = "rag-data-loader"
version = "0.1.0"
description = "LangChain-based Retrieval-Augmented Generation pipeline: ingest PDFs, chunk, embed, store, retrieve, and generate."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Rahul Sivanand", email = "rahulsivanand24@gmail.com" }]
dependencies = [
    "pydantic>=2.6",
    "pydantic-settings>=2.2",
    "langchain>=0.3.9",
    "langchain-core>=0.3.9",
    "langchain-community>=0.3",
    "langchain-text-splitters>=0.3",
    "pymupdf>=1.24",
    "tiktoken>=0.7",
    "langchain-chroma>=0.1.4",
    "chromadb>=0.5",
    "langchain-qdrant>=0.1",
    "qdrant-client>=1.9",
    "typer>=0.12",
]

[project.optional-dependencies]
huggingface = ["langchain-huggingface>=0.1", "sentence-transformers>=2.6"]
openai = ["langchain-openai>=0.2"]
voyage = ["langchain-voyageai>=0.1"]

[project.scripts]
rag-loader = "rag_loader.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/rag_loader"]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "hypothesis>=6.100",
    "ruff>=0.9",
    "mypy>=1.15",
    "pre-commit>=4.0",
]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "C4", "RUF"]

[tool.ruff.lint.isort]
known-first-party = ["rag_loader"]

[tool.mypy]
python_version = "3.11"
strict = true
ignore_missing_imports = true
plugins = ["pydantic.mypy"]
