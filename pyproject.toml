[project]
name = "rag-data-loader"
version = "0.1.0"
description = "LangChain-based Retrieval-Augmented Generation pipeline: ingest PDFs, chunk, embed, store, retrieve, and generate."
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Rahul Sivanand", email = "rahulsivanand24@gmail.com" }]
dependencies = [
    "pydantic>=2.6",
    "pydantic-settings>=2.2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/rag_loader"]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "hypothesis>=6.100",
]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-q"
